<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Dashboard - BeverHub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            try {
                const settings = JSON.parse(localStorage.getItem('providerSettings') || '{}');
                if (settings.darkMode === true) {
                    document.documentElement.classList.add('dark-mode');
                    document.body.classList.add('dark-mode');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        body.dark-mode { background: #0a0e1a; color: #e0e8ff; }
        body.dark-mode .modern-navbar { background: rgba(20, 40, 80, 0.4) !important; border-bottom: 1px solid rgba(102, 126, 234, 0.3); }
        body.dark-mode .icon-dashboard-container { background: #0a0e1a; }
        body.dark-mode .icon-dashboard-header h1 { color: #ffffff; }
        body.dark-mode .icon-dashboard-header p { color: #e0e8ff; }
        body.dark-mode .dashboard-icons .icon-item { background: rgba(20, 40, 80, 0.4) !important; border: 1px solid rgba(102, 126, 234, 0.3); }
        body.dark-mode .dashboard-icons .icon-item h3 { color: #ffffff; }
        body.dark-mode .dashboard-icons .icon-item p { color: #e0e8ff; }
        body.dark-mode .footer { background: rgba(20, 40, 80, 0.4); border-top: 1px solid rgba(102, 126, 234, 0.3); }
        body.dark-mode .footer h3, body.dark-mode .footer h4, body.dark-mode .footer p, body.dark-mode .footer a { color: #e0e8ff; }
        body.dark-mode .dropdown-menu { background: rgba(20, 40, 80, 0.95) !important; border: 1px solid rgba(102, 126, 234, 0.3) !important; }
        body.dark-mode .dropdown-menu a { color: #e0e8ff !important; }
        body.dark-mode .dropdown-menu a:hover { background: rgba(30, 50, 90, 0.6) !important; }
    </style>
</head>
<body>
    <!-- Modern Top Navigation -->
    <nav class="modern-navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" class="beverhub-logo">
                    <span class="logo-mascot">🦫</span>
                    <span class="logo-brand">
                        <span class="logo-name"><span class="bever">Bever</span><span class="hub">hub</span></span>
                        <span class="logo-underline"></span>
                        <span class="logo-tagline"></span>
                    </span>
                </a>
            </div>
            <div class="nav-actions">
                <div class="nav-notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge">5</span>
                </div>
                <div class="nav-user-menu">
                    <div class="user-avatar-small">👨‍💼</div>
                    <span class="user-name-nav">Professional</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- Icon-Based Dashboard -->
    <div class="icon-dashboard-container">
        <div class="icon-dashboard-header">
            <h1>Provider Dashboard 💼</h1>
            <p>Manage your services and bookings</p>
        </div>

        <div class="icon-menu-grid">
            <a href="provider-overview.html" class="icon-menu-card">
                <div class="icon">📊</div>
                <h3>Overview</h3>
                <p>Dashboard & analytics</p>
            </a>

            <a href="provider-bookings.html" class="icon-menu-card">
                <div class="icon">📅</div>
                <h3>Bookings</h3>
                <p>Manage appointments</p>
            </a>

            <a href="provider-earnings.html" class="icon-menu-card">
                <div class="icon">💰</div>
                <h3>Earnings</h3>
                <p>View income & payouts</p>
            </a>

            <a href="provider-profile.html" class="icon-menu-card">
                <div class="icon">👤</div>
                <h3>Profile</h3>
                <p>Edit your profile</p>
            </a>

            <a href="provider-availability.html" class="icon-menu-card">
                <div class="icon">🕐</div>
                <h3>Availability</h3>
                <p>Set your schedule</p>
            </a>

            <a href="provider-services.html" class="icon-menu-card">
                <div class="icon">🔧</div>
                <h3>Services</h3>
                <p>Manage offerings</p>
            </a>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="dark-mode.js"></script>
    <script src="logo.js"></script>
</body>
</html>
